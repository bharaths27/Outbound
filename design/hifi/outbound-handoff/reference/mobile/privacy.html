<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outbound · Privacy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#6B1F33}a:hover{color:#4A1424}

</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #FFF8EF; font-family: 'DM Sans', system-ui, sans-serif; color: #2B1A1F">
  <header style="display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 8px; background: #6B1F33; color: #FFFFFF">
    <a href="profile.html" aria-label="Back to profile" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <h1 style="flex: 1; margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 22px">Privacy</h1>
  </header>
  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 18px">
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-family: 'Fraunces', Georgia, serif; font-size: 20px; font-weight: 600; margin-bottom: 10px">Who can see your visits</legend>
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
        <button role="radio" aria-checked="{{o.aria}}" onClick="{{o.pick}}" style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; border: {{o.border}}; border-radius: 16px; background: #FFFFFF; text-align: left; font-family: 'DM Sans', sans-serif; cursor: pointer">
          <span style="width: 20px; height: 20px; flex: none; margin-top: 1px; border-radius: 50%; border: {{o.dot}}; box-sizing: border-box"></span>
          <span><span style="display: block; font-size: 15px; font-weight: 700; color: #2B1A1F">{{o.name}}</span><span style="display: block; margin-top: 2px; font-size: 13px; line-height: 1.4; color: #5A4549">{{o.note}}</span></span>
        </button>
      </sc-for>
      <div role="status" style="font-size: 13px; font-weight: 600; color: #2F6B4F">Saved</div>
    </fieldset>

    <div style="display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: #F1E6D3">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B1F33" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3D2A2E">Your live location is never shared. Outbound checks it only when you check in.</p>
    </div>

    <section>
      <h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 20px; font-weight: 600">Hide single visits</h2>
      <p style="margin: 4px 0 10px; font-size: 13px; color: #6E5A5E">Hidden visits still count for your XP and your school.</p>
      <ul style="margin: 0; padding: 0; border-radius: 18px; background: #FFFFFF; border: 1px solid #EADDC8; overflow: hidden">
        <sc-for list="{{visits}}" as="v" hint-placeholder-count="4">
          <li style="list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #F1E6D3">
            <div style="flex: 1; min-width: 0">
              <div style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700">{{v.quest}}<sc-if value="{{v.hidden}}" hint-placeholder-val="{{false}}"><span style="padding: 1px 7px; border-radius: 6px; background: #EFE7DA; color: #5A4549; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em">Hidden</span></sc-if></div>
              <div style="font-size: 13px; color: #6E5A5E">{{v.date}}</div>
            </div>
            <button role="switch" aria-checked="{{v.aria}}" aria-label="Hide {{v.quest}}" onClick="{{v.toggle}}" style="position: relative; width: 48px; height: 28px; flex: none; border: 0; border-radius: 999px; background: {{v.track}}; cursor: pointer"><span style="position: absolute; top: 4px; left: {{v.knob}}; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; transition: left .15s"></span></button>
          </li>
        </sc-for>
      </ul>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { who: 'everyone', hidden: { 2: true } }; }
  renderVals() {
    const O = [['everyone', 'Everyone on Outbound', 'Your stamps show on your profile and next to your name on the leaderboard.'], ['friends', 'Friends only', 'Only people you add can see where you’ve been.'], ['me', 'Only me', 'Ghost mode. Nobody sees your visits, and your XP still counts for your school.']];
    const opts = O.map(([id, name, note]) => { const on = this.state.who === id; return { name, note, aria: on ? 'true' : 'false', border: on ? '2px solid #6B1F33' : '1px solid #E2D3BC', dot: on ? '6px solid #6B1F33' : '2px solid #CDBBA3', pick: () => this.setState({ who: id }) }; });
    const V = [['Tatte on Boylston', 'Today'], ['MFA Meetup', 'Nov 18'], ['Trident Booksellers', 'Nov 14'], ['Esplanade Views', 'Nov 9']];
    const visits = V.map(([quest, date], i) => { const h = !!this.state.hidden[i]; return { quest, date, hidden: h, aria: h ? 'true' : 'false', track: h ? '#6B1F33' : '#CDBBA3', knob: h ? '24px' : '4px', toggle: () => this.setState({ hidden: { ...this.state.hidden, [i]: !h } }) }; });
    return { opts, visits };
  }
}
</script>
</body>
</html>
