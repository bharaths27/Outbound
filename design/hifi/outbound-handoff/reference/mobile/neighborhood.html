      <rect x="146" y="70" width="34" height="150" fill="#A9B9CC"></rect><rect x="160" y="52" width="4" height="20" fill="#A9B9CC"></rect>
      <path d="M246 24h30l8 196h-46z" fill="#6F8FB3"></path><path d="M262 24v196" stroke="#8BA6C4" stroke-width="2"></path>
      <g fill="#9C4A3A"><rect x="0" y="120" width="62" height="100"></rect><rect x="122" y="128" width="58" height="92"></rect><rect x="298" y="118" width="62" height="102"></rect></g>
      <g fill="#B5583F"><rect x="60" y="108" width="64" height="112"></rect><rect x="180" y="114" width="60" height="106"></rect><rect x="356" y="128" width="40" height="92"></rect></g>
      <g fill="#8A3E31"><rect x="238" y="124" width="62" height="96"></rect></g>
      <g fill="#F6EDDD">
        <rect x="10" y="134" width="12" height="16"></rect><rect x="36" y="134" width="12" height="16"></rect><rect x="10" y="164" width="12" height="16"></rect><rect x="36" y="164" width="12" height="16"></rect>

        <rect x="192" y="128" width="12" height="16"></rect><rect x="218" y="128" width="12" height="16"></rect><rect x="192" y="158" width="12" height="16"></rect><rect x="218" y="158" width="12" height="16"></rect>

      </g>

        <rect x="348" y="184" width="5" height="36" fill="#5A3A2A"></rect><circle cx="350" cy="174" r="24" fill="#B5602A"></circle></g>
    </svg>
    <div style="position: absolute; top: 14px; left: 12px; right: 12px; display: flex; gap: 8px">
      <a href="explore.html" aria-label="Back to map" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #FBF6EC; color: #2B1A1F; box-shadow: 0 4px 12px rgba(74, 20, 36, 0.18)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
      </a>
      <span style="flex: 1"></span>
      <button aria-label="Save Back Bay" aria-pressed="true" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: #FBF6EC; color: #B3121F; box-shadow: 0 4px 12px rgba(74, 20, 36, 0.18); cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
      </button>
      <button aria-label="Share Back Bay" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: #FBF6EC; color: #2B1A1F; box-shadow: 0 4px 12px rgba(74, 20, 36, 0.18); cursor: pointer">

  </div>

  <main style="position: relative; flex: 1; min-height: 0; margin-top: -22px; padding: 18px 16px 0; border-radius: 24px 24px 0 0; background: #FBF6EC; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 12px; align-items: flex-start">
      <div style="flex: 1; min-width: 0">
        <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 32px; font-weight: 700; line-height: 1.05; color: #6B1F33">Back Bay</h1>
        <div style="display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 14px; color: #3D2A2E">
          <span style="width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: #00843D; color: #FFFFFF; font-size: 11px; font-weight: 700">G</span>
          Copley · Green Line
        </div>
      </div>
      <svg width="64" height="64" viewBox="0 0 100 100" role="img" aria-label="Back Bay stamp, Gold" style="flex: none; margin-top: -40px; width: 92px; height: 85px"><circle cx="50" cy="50" r="46" fill="#FFF4D6" stroke="#D9A21B" stroke-width="4" stroke-dasharray="2.5 3"></circle><circle cx="50" cy="50" r="38" fill="none" stroke="#1F4A7A" stroke-width="1.5"></circle><path d="M28 66V48h14v18M42 66V44h16v22M58 66V48h14v18M32 54h6M46 52h8M62 54h6" transform="translate(50 55) scale(0.9) translate(-50 -55)" fill="none" stroke="#1F4A7A" stroke-width="3" stroke-linejoin="round"></path></svg>
    </div>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5A4549">Boston’s shopping and culture hub, with historic brownstones, museums, and great food.</p>

    <div role="tablist" aria-label="Back Bay sections" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #F1E6D3">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <sc-if value="{{t.on}}" hint-placeholder-val="{{false}}">
          <button role="tab" aria-selected="true" onClick="{{t.pick}}" style="flex: 1; height: 40px; border: 0; border-radius: 999px; background: #6B1F33; color: #FFFFFF; font: 600 14px 'DM Sans', sans-serif; cursor: pointer">{{t.label}}</button>
        </sc-if>
        <sc-if value="{{t.off}}" hint-placeholder-val="{{true}}">
          <button role="tab" aria-selected="false" onClick="{{t.pick}}" style="flex: 1; height: 40px; border: 0; border-radius: 999px; background: transparent; color: #5A4549; font: 600 14px 'DM Sans', sans-serif; cursor: pointer">{{t.label}}</button>
        </sc-if>
      </sc-for>
    </div>

    <ul style="margin: 0; padding: 0 0 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; overflow-y: auto">
      <sc-for list="{{items}}" as="q" hint-placeholder-count="3">
        <li style="list-style: none">
          <a href="quests.html" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EADDC8; color: #2B1A1F; text-decoration: none">
            <svg width="60" height="60" viewBox="0 0 64 64" aria-hidden="true" style="flex: none"><rect width="64" height="64" rx="14" fill="{{q.tint}}"></rect><path d="{{q.icon}}" transform="translate(16 16) scale(1.33)" fill="none" stroke="{{q.ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 16px; font-weight: 700">{{q.title}}</div>
              <div style="margin-top: 2px; font-size: 13px; color: #6E5A5E">{{q.desc}}</div>
              <div style="display: flex; gap: 6px; margin-top: 6px">
                <span style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: #F1E6D3; color: #3D2A2E; font-size: 12px; font-weight: 600"><svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="{{q.ink}}"></circle></svg>{{q.cat}}</span>
                <span style="padding: 3px 9px; border-radius: 999px; background: #FCE9B8; color: #5C3F00; font-size: 12px; font-weight: 700">+{{q.xp}} XP</span>
              </div>
            </div>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E5A5E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          </a>
        </li>
      </sc-for>
    </ul>
  </main>

  <div style="display: flex; gap: 10px; padding: 12px 16px 24px; background: #FBF6EC; border-top: 1px solid #E6D8C2">
    <button aria-label="Directions by T" style="width: 52px; height: 52px; flex: none; display: flex; align-items: center; justify-content: center; border: 1px solid #E2D3BC; border-radius: 16px; background: #FFFFFF; color: #6B1F33; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 4L3 11l7 3 3 7z"></path></svg>
    </button>
    <a href="quests.html" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 16px; background: #6B1F33; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">Start Café Crawl <span style="padding: 2px 8px; border-radius: 999px; background: #F2C14E; color: #4A1424; font-size: 13px">+150 XP</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'Quests' }; }
  renderVals() {
    const ICON = {
      Food: 'M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2.5 1.5-3.5 4-3.5 8h3.5',
      Event: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      Scenery: 'M3 19l6-9 4 5 2-3 6 7zM16 7a2 2 0 1 0 0-.01'
    };
    const TONE = { Food: ['#F8E1E6', '#8A2A44'], Event: ['#E8E2F5', '#4B3A80'], Scenery: ['#DDE8F5', '#1F4A7A'] };
    const Q = [
      ['Café Crawl', 'Food', 150, 'Try a local café in Back Bay'],
      ['Museum Meetup', 'Event', 200, 'Visit a museum or gallery nearby'],
      ['Esplanade Views', 'Scenery', 150, 'Walk the Charles and snap a photo'],
      ['Newbury Street Bites', 'Food', 100, 'Grab a snack between shops'],
      ['Library Courtyard', 'Scenery', 100, 'Find the courtyard at Copley Square']
    ];
    const all = Q.map(([title, cat, xp, desc]) => ({ title, cat, xp, desc, icon: ICON[cat], tint: TONE[cat][0], ink: TONE[cat][1] }));
    const map = { Quests: null, Food: 'Food', Events: 'Event', Scenery: 'Scenery' };
    const want = map[this.state.tab];
    const items = want ? all.filter((q) => q.cat === want) : all.slice(0, 3);
    const tabs = ['Quests', 'Food', 'Events', 'Scenery'].map((id) => ({
      label: id, on: this.state.tab === id, off: this.state.tab !== id, pick: () => this.setState({ tab: id }) }));
    return { items, tabs };
  }
}
</script>
</body>
</html>
