<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outbound · Today’s Quests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#6B1F33}a:hover{color:#4A1424}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F6EDDD; font-family: 'DM Sans', system-ui, sans-serif; color: #2B1A1F">

  <header style="padding: 14px 16px 16px; background: #6B1F33; color: #FFFFFF">
    <div style="display: flex; align-items: center; gap: 8px">
      <h1 style="flex: 1; margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 28px">Today’s Quests</h1>
      <a href="leaderboard-schools.html" style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; background: #F2C14E; color: #4A1424; font-size: 14px; font-weight: 700; text-decoration: none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5-4.9-4.5 6.6-.8z"></path></svg>
        3,420 XP
      </a>
    </div>
    <div style="margin-top: 12px; display: flex; align-items: center; gap: 12px">
      <div role="progressbar" aria-label="Quests done today" aria-valuemin="0" aria-valuemax="5" aria-valuenow="{{doneCount}}" style="flex: 1; height: 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); overflow: hidden">
        <div style="width: {{donePct}}; height: 100%; border-radius: 999px; background: #F2C14E"></div>
      </div>
      <span style="font-size: 13px; color: #F1DCE1">{{doneCount}} of 5 done · +{{doneXp}} XP</span>
    </div>
  </header>

  <div role="group" aria-label="Filter quests" style="display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <sc-if value="{{f.on}}" hint-placeholder-val="{{false}}">
        <button aria-pressed="true" onClick="{{f.pick}}" style="flex: none; height: 40px; padding: 0 16px; border: 1px solid #6B1F33; border-radius: 999px; background: #6B1F33; color: #FFFFFF; font: 600 14px 'DM Sans', sans-serif; cursor: pointer">{{f.label}}</button>
      </sc-if>
      <sc-if value="{{f.off}}" hint-placeholder-val="{{true}}">
        <button aria-pressed="false" onClick="{{f.pick}}" style="flex: none; height: 40px; padding: 0 16px; border: 1px solid #E2D3BC; border-radius: 999px; background: #FFFFFF; color: #2B1A1F; font: 600 14px 'DM Sans', sans-serif; cursor: pointer">{{f.label}}</button>
      </sc-if>
    </sc-for>
  </div>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <section style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: #6B1F33; color: #FFFFFF">
      <div style="width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #F2C14E; color: #4A1424">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"></circle><circle cx="17" cy="9" r="2.6"></circle><path d="M3 19c.6-3 3-5 6-5s5.4 2 6 5M15 14.5c2.6-.3 5 1.4 5.6 4.5"></path></svg>
      </div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #F2C14E">Cross-school bonus</div>
        <div style="margin-top: 2px; font-size: 15px; font-weight: 600; line-height: 1.3">Complete any quest with a student from another school for 2× XP</div>
      </div>
    </section>

    <ul style="margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{quests}}" as="q" hint-placeholder-count="5">
        <li style="list-style: none; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 10px; border-radius: 18px; border: 1px solid #EADDC8; background-color: #ffffff">
          <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" style="flex: none"><rect width="64" height="64" rx="14" fill="{{q.tint}}"></rect><path d="{{q.icon}}" transform="translate(16 16) scale(1.33)" fill="none" stroke="{{q.ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 16px; font-weight: 700; line-height: 1.25">{{q.title}}</div>
            <div style="display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 13px; color: #6E5A5E">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="{{q.line}}"></circle><text x="8" y="11.2" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">{{q.lineLetter}}</text></svg>
              {{q.where}}
            </div>
            <div style="display: flex; gap: 6px; margin-top: 6px">
              <span style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: #F1E6D3; color: #3D2A2E; font-size: 12px; font-weight: 600"><svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="{{q.ink}}"></circle></svg>{{q.cat}}</span>
              <span style="padding: 3px 9px; border-radius: 999px; background: #FCE9B8; color: #5C3F00; font-size: 12px; font-weight: 700">+{{q.xp}} XP</span>
            </div>
          </div>
          <sc-if value="{{q.done}}" hint-placeholder-val="{{false}}">
            <button aria-pressed="true" aria-label="Mark {{q.title}} not done" onClick="{{q.toggle}}" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: #6B1F33; color: #FFFFFF; cursor: pointer">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </button>
          </sc-if>
          <sc-if value="{{q.todo}}" hint-placeholder-val="{{true}}">
            <button aria-pressed="false" aria-label="Mark {{q.title}} done" onClick="{{q.toggle}}" style="width: 44px; height: 44px; flex: none; border: 2px solid #CDBBA3; border-radius: 12px; background: #FFFFFF; cursor: pointer"></button>
          </sc-if>
        </li>
      </sc-for>
    </ul>
  </main>

  <nav aria-label="Primary" style="display: flex; justify-content: space-around; padding: 8px 6px 20px; background: #FBF6EC; border-top: 1px solid #E6D8C2">
    <sc-for list="{{nav}}" as="t" hint-placeholder-count="5">
      <sc-if value="{{t.active}}" hint-placeholder-val="{{false}}">
        <a href="{{t.href}}" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 66px; min-height: 54px; padding: 6px 8px; border-radius: 16px; background: #6B1F33; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 600">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
          <span>{{t.label}}</span>
        </a>
      </sc-if>
      <sc-if value="{{t.idle}}" hint-placeholder-val="{{true}}">
        <a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 66px; min-height: 54px; padding: 6px 8px; border-radius: 16px; background: transparent; color: #6E5A5E; text-decoration: none; font-size: 12px; font-weight: 600">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
          <span>{{t.label}}</span>
        </a>
      </sc-if>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'All', done: { 0: true } }; }
  renderVals() {
    const ICON = {
      Food: 'M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2.5 1.5-3.5 4-3.5 8h3.5',
      Event: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      Scenery: 'M3 19l6-9 4 5 2-3 6 7zM16 7a2 2 0 1 0 0-.01'
    };
    const TONE = { Food: ['#F8E1E6', '#8A2A44'], Event: ['#E8E2F5', '#4B3A80'], Scenery: ['#DDE8F5', '#1F4A7A'] };
    const LINE = { G: '#00843D', R: '#DA291C', O: '#C46A00', SL: '#5B6770' };
    const Q = [
      ['Back Bay Café Crawl', 'Food', 150, 'G', 'Back Bay · Copley'],
      ['MFA Meetup', 'Event', 200, 'G', 'Fenway · Museum of Fine Arts'],
      ['Esplanade Views', 'Scenery', 150, 'R', 'Charles/MGH · Esplanade'],
      ['North End Cannoli Run', 'Food', 100, 'O', 'North End · Haymarket'],
      ['Seaport Sunset Walk', 'Scenery', 120, 'SL', 'Seaport · Courthouse']
    ];
    const done = this.state.done;
    const all = Q.map(([title, cat, xp, l, where], i) => ({
      title, cat, xp, where, lineLetter: l, line: LINE[l], icon: ICON[cat], tint: TONE[cat][0], ink: TONE[cat][1],
      done: !!done[i], todo: !done[i],
      toggle: () => this.setState({ done: { ...this.state.done, [i]: !this.state.done[i] } })
    }));
    const quests = this.state.filter === 'All' ? all : all.filter((q) => q.cat === this.state.filter);
    const doneCount = all.filter((q) => q.done).length;
    const doneXp = all.filter((q) => q.done).reduce((s, q) => s + q.xp, 0);
    const filters = ['All', 'Food', 'Event', 'Scenery'].map((f) => ({
      label: f === 'Event' ? 'Events' : f, on: this.state.filter === f, off: this.state.filter !== f, pick: () => this.setState({ filter: f }) }));
    const active = 'Quests';
    const T = [
      ['Explore', 'explore.html', 'M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z'],
      ['Quests', 'quests.html', 'M5 21V4M5 4h11l-2 4 2 4H5'],
      ['Passport', 'passport.html', 'M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM11.5 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM9 17h5'],
      ['Leaderboard', 'leaderboard-schools.html', 'M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8'],
      ['Events', '#', 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4']
    ];
    return {
      quests, filters, doneCount, doneXp, donePct: (doneCount / 5 * 100) + '%',
      nav: T.map(([label, href, d]) => ({ label, href, d, active: label === active, idle: label !== active }))
    };
  }
}
</script>
</body>
</html>
