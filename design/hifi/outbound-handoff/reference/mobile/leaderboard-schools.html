<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outbound · School Leaderboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#6B1F33}a:hover{color:#4A1424}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F6EDDD; font-family: 'DM Sans', system-ui, sans-serif; color: #2B1A1F">

  <header style="position: relative; padding: 14px 16px 0; background: #6B1F33; color: #FFFFFF; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F2C14E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"></path></svg>
      <h1 style="flex: 1; margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 26px">School Leaderboard</h1>
    </div>
    <div role="tablist" aria-label="Time range" style="display: flex; gap: 4px; margin-top: 12px; padding: 4px; border-radius: 999px; background: rgba(255, 255, 255, 0.14)">
      <sc-for list="{{ranges}}" as="r" hint-placeholder-count="2">
        <sc-if value="{{r.on}}" hint-placeholder-val="{{false}}">
          <button role="tab" aria-selected="true" onClick="{{r.pick}}" style="flex: 1; height: 40px; border: 0; border-radius: 999px; background: #FBF6EC; color: #6B1F33; font: 700 14px 'DM Sans', sans-serif; cursor: pointer">{{r.label}}</button>
        </sc-if>
        <sc-if value="{{r.off}}" hint-placeholder-val="{{true}}">
          <button role="tab" aria-selected="false" onClick="{{r.pick}}" style="flex: 1; height: 40px; border: 0; border-radius: 999px; background: transparent; color: #FFFFFF; font: 600 14px 'DM Sans', sans-serif; cursor: pointer">{{r.label}}</button>
        </sc-if>
      </sc-for>
    </div>

    <ol aria-label="Top three schools" style="margin: 18px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end">
      <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
        <li style="list-style: none; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <svg width="{{p.size}}" height="{{p.size}}" viewBox="0 0 64 64" role="img" aria-label="{{p.name}}, rank {{p.rank}}"><circle cx="32" cy="32" r="29" fill="{{p.color}}" stroke="#FBF6EC" stroke-width="4"></circle><text x="32" y="38.5" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">{{p.abbr}}</text></svg>
          <div style="font-size: 14px; font-weight: 700; text-align: center">{{p.name}}</div>
          <div style="font-size: 13px; color: #F2C14E; font-weight: 700">{{p.xp}} XP</div>
          <div style="width: 100%; height: {{p.h}}; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; box-sizing: border-box; border-radius: 14px 14px 0 0; background: #8A2A44; font-family: 'Fraunces', Georgia, serif; font-size: 28px; font-weight: 700; color: #F2C14E">{{p.rank}}</div>
        </li>
      </sc-for>
    </ol>
  </header>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <section style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #EADDC8">
      <div aria-hidden="true" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #F2C14E; color: #4A1424; font-family: 'Fraunces', Georgia, serif; font-size: 20px; font-weight: 700">V</div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 15px; font-weight: 700">Your BU contribution</div>
        <div style="font-size: 13px; color: #6E5A5E">3,420 XP this week · top [N]% of BU riders</div>
      </div>
      <a href="quests.html" style="display: flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 999px; background: #6B1F33; color: #FFFFFF; font-size: 13px; font-weight: 700; text-decoration: none">Earn more</a>
    </section>

    <ol start="4" style="margin: 0; padding: 0; display: flex; flex-direction: column; border-radius: 18px; background: #FFFFFF; border: 1px solid #EADDC8; overflow: hidden">
      <sc-for list="{{rest}}" as="s" hint-placeholder-count="4">
        <li style="list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid #F1E6D3">
          <span style="width: 22px; font-weight: 700; color: #6E5A5E; text-align: center">{{s.rank}}</span>
          <svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="{{s.color}}"></circle><text x="32" y="39" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">{{s.abbr}}</text></svg>
          <div style="flex: 1; min-width: 0">
            <div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 700"><span>{{s.name}}</span><span style="font-weight: 600; color: #3D2A2E">{{s.xp}}</span></div>
            <div style="height: 6px; margin-top: 6px; border-radius: 999px; background: #F1E6D3; overflow: hidden"><div style="width: {{s.pct}}; height: 100%; border-radius: 999px; background: #9A7FB8"></div></div>
          </div>
        </li>
      </sc-for>
    </ol>
    <p style="margin: 0; font-size: 12px; color: #6E5A5E; text-align: center">Resets every Monday at 12:00 AM · Sample standings</p>
  </main>

  <nav aria-label="Primary" style="display: flex; justify-content: space-around; padding: 8px 6px 20px; background: #FBF6EC; border-top: 1px solid #E6D8C2">
    <sc-for list="{{nav}}" as="t" hint-placeholder-count="5">
      <sc-if value="{{t.active}}" hint-placeholder-val="{{false}}">
        <a href="{{t.href}}" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 66px; min-height: 54px; padding: 6px 8px; border-radius: 16px; background: #6B1F33; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 600">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
          <span>{{t.label}}</span>
        </a>
      </sc-if>
      <sc-if value="{{t.idle}}" hint-placeholder-val="{{true}}">
        <a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 66px; min-height: 54px; padding: 6px 8px; border-radius: 16px; background: transparent; color: #6E5A5E; text-decoration: none; font-size: 12px; font-weight: 600">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
          <span>{{t.label}}</span>
        </a>
      </sc-if>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { range: 'week' }; }
  renderVals() {
    const S = [
      ['BU', 'BU', '#B3121F', 12480, 184300], ['Northeastern', 'NEU', '#26262B', 10930, 171050], ['Tufts', 'TU', '#2C5F9E', 8760, 122400],
      ['MIT', 'MIT', '#8A1538', 7215, 118900], ['Harvard', 'HU', '#A51C30', 6980, 109250], ['Emerson', 'EC', '#5E3A8C', 4120, 61700], ['Suffolk', 'SU', '#1B365D', 3560, 52300]
    ];
    const k = this.state.range === 'week' ? 3 : 4;
    const rows = S.map((s) => ({ name: s[0], abbr: s[1], color: s[2], n: s[k] })).sort((a, b) => b.n - a.n);
    const top = rows[0].n;
    const fmt = (n) => n.toLocaleString('en-US');
    const ranked = rows.map((r, i) => ({ ...r, rank: i + 1, xp: fmt(r.n), pct: Math.round(r.n / top * 100) + '%' }));
    const podium = [ranked[1], ranked[0], ranked[2]].map((r) => ({ ...r, size: r.rank === 1 ? 72 : 58, h: r.rank === 1 ? '92px' : r.rank === 2 ? '68px' : '52px' }));
    const ranges = [['week', 'This Week'], ['all', 'All Time']].map(([id, label]) => ({
      label, on: this.state.range === id, off: this.state.range !== id, pick: () => this.setState({ range: id }) }));
    const active = 'Leaderboard';
    const T = [
      ['Explore', 'explore.html', 'M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z'],
      ['Quests', 'quests.html', 'M5 21V4M5 4h11l-2 4 2 4H5'],
      ['Passport', 'passport.html', 'M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM11.5 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM9 17h5'],
      ['Leaderboard', 'leaderboard-schools.html', 'M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8'],
      ['Events', '#', 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4']
    ];
    return {
      podium, rest: ranked.slice(3), ranges,
      nav: T.map(([label, href, d]) => ({ label, href, d, active: label === active, idle: label !== active }))
    };
  }
}
</script>
</body>
</html>
