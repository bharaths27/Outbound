class Component extends DCLogic {

    const ICON = {
      Food: 'M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2.5 1.5-3.5 4-3.5 8h3.5',
      Event: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      Scenery: 'M3 19l6-9 4 5 2-3 6 7zM16 7a2 2 0 1 0 0-.01'
    };
    const TONE = { Food: ['#F8E1E6', '#8A2A44'], Event: ['#E8E2F5', '#4B3A80'], Scenery: ['#DDE8F5', '#1F4A7A'] };
    const quests = [
      ['Café Crawl', 'Food', 150, 'Try a local café in Back Bay'],
      ['Museum Meetup', 'Event', 200, 'Visit a museum or gallery nearby'],
      ['Esplanade Views', 'Scenery', 150, 'Walk the Charles and snap a photo']
    ].map(([title, cat, xp, desc]) => ({ title, xp, desc, icon: ICON[cat], tint: TONE[cat][0], ink: TONE[cat][1] }));
    const schools = [['BU', 12480, '#E5A92F'], ['Northeastern', 10930, '#7F95B8'], ['Tufts', 8760, '#9A7FB8']]
      .map(([name, n, bar], i) => ({ name, bar, rank: i + 1, xp: n.toLocaleString('en-US'), pct: Math.round(n / 12480 * 100) + '%' }));
    return { quests, schools };
  }
}
